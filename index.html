<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inaya - মানুষের প্রয়োজন এক জায়গায়</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
    }

    .search {
      padding: 20px;
      text-align: center;
      background: white;
    }

    .search input {
      width: 90%;
      max-width: 600px;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 25px 10px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card .icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 17px;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      background: #222;
      color: white;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>Inaya</h1>
    <p>মানুষের প্রয়োজন এক জায়গায়</p>
  </header>

  <div class="search">
    <input type="text" placeholder="আপনার প্রয়োজন লিখে খুঁজুন...">
  </div>

  <div class="container">

    <h2 class="title">Inaya Services</h2>

    <div class="services">

      <div class="card">
        <div class="icon">🏪</div>
        <h3>দোকান ও ব্যবসা</h3>
      </div>

      <div class="card">
        <div class="icon">🔧</div>
        <h3>কারিগরি সেবা</h3>
      </div>

      <div class="card">
        <div class="icon">💼</div>
        <h3>চাকরি</h3>
      </div>

      <div class="card">
        <div class="icon">🛒</div>
        <h3>পণ্য ও সেবা</h3>
      </div>

      <div class="card">
        <div class="icon">📍</div>
        <h3>কাছাকাছি সেবা</h3>
      </div>

      <div class="card">
        <div class="icon">📢</div>
        <h3>নোটিশ ও খবর</h3>
      </div>

      <div class="card">
        <div class="icon">📚</div>
        <h3>শিক্ষা</h3>
      </div>

      <div class="card">
        <div class="icon">🆘</div>
        <h3>জরুরি সেবা</h3>
      </div>

    </div>

  </div>

  <footer>
    <p>© 2026 Inaya — All Rights Reserved</p>
  </footer>

</body>
</html>
